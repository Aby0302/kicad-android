name: Android build
run-name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ actions ]

env:
  QT_VERSION: "6.6.2"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - run: df -h /

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - run: sudo mkdir -m 777 /usr/local/lib/android

      - run: df -h /

      - name: Install meson
        run: sudo pip3 install --upgrade meson

      - name: Install apt packages
        run: sudo apt-get install -y ninja-build protobuf-compiler

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android environment
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK / NDK / tools
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "ndk;25.2.9519653"
          sdkmanager "build-tools;34.0.0"

      - name: Install Qt (desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{env.QT_VERSION}}
          setup-python: false

      - name: Install Qt (Android x86_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{env.QT_VERSION}}
          host: 'linux'
          target: 'android'
          arch: 'android_x86_64'
          setup-python: false

      - name: Install Qt (Android armv8)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{env.QT_VERSION}}
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          setup-python: false

      - name: Setup env
        run: |
          echo "QT_HOST_PATH=/home/runner/work/${{ github.event.repository.name }}/Qt/${{env.QT_VERSION}}/gcc_64" >> $GITHUB_ENV
          echo "QT_TARGET_BASE=/home/runner/work/${{ github.event.repository.name }}/Qt/${{env.QT_VERSION}}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Checkout repository (and submodules)
        uses: actions/checkout@v4
        with:
          ref: actions
          submodules: recursive

      - name: Fetch tarballs
        run: |
          # Yardımcı: dosyaya indir, boyut kontrol et, sonra aç
          fetch() {
            local DIR="$1" URL="$2" TMP="/tmp/tb_$(basename $DIR).tar.gz"
            mkdir -p "$DIR"
            echo ">>> $DIR"
            curl -fsSL --retry 3 --retry-delay 5 -L -o "$TMP" "$URL"
            SIZE=$(stat -c%s "$TMP")
            if [ "$SIZE" -lt 10240 ]; then
              echo "ERROR: $DIR too small ($SIZE bytes) — likely HTML error page"
              cat "$TMP"; exit 1
            fi
            tar -xz --strip-components=1 -C "$DIR" -f "$TMP"
            rm -f "$TMP"
            echo "<<< OK $DIR ($SIZE bytes)"
          }

          fetch OCCT     'https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V7_8_1.tar.gz'
          fetch libgit2  'https://codeload.github.com/libgit2/libgit2/tar.gz/refs/tags/v1.8.0'
          fetch cairo    'https://gitlab.freedesktop.org/cairo/cairo/-/archive/02754405330989198548d1945b3c55566ba0c6b7/cairo-02754405330989198548d1945b3c55566ba0c6b7.tar.gz'
          fetch zstd     'https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz'
          fetch protobuf 'https://github.com/protocolbuffers/protobuf/archive/refs/tags/v3.12.4.tar.gz'
          fetch openssl  'https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz'
          fetch icu      'https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz'
          fetch pcre2    'https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz'
          fetch boost    'https://github.com/boostorg/boost/releases/download/boost-1.85.0/boost-1.85.0-cmake.tar.gz'

          # ngspice — SourceForge güvenilmez, GitHub mirror önce dene
          fetch ngspice 'https://github.com/imr/ngspice/archive/refs/tags/ngspice-42.tar.gz' || \
          fetch ngspice 'https://altushost-swe.dl.sourceforge.net/project/ngspice/ng-spice-rework/42/ngspice-42.tar.gz'

          # unixODBC — FTP çalışmıyor, HTTP kullan
          fetch unixODBC 'https://www.unixodbc.org/unixODBC-2.3.12.tar.gz' || \
          fetch unixODBC 'http://www.unixodbc.org/unixODBC-2.3.12.tar.gz'

          # python — .tgz uzantısı
          mkdir -p python
          curl -fsSL --retry 3 -L -o /tmp/python.tgz 'https://www.python.org/ftp/python/3.13.0/Python-3.13.0rc1.tgz'
          tar -xz --strip-components=1 -C python -f /tmp/python.tgz
          rm -f /tmp/python.tgz
          echo "<<< OK python"

      # Boost-for-Android'ın beklediği boost_1_84_0.tar.bz2 (4 aşamalı fallback)
      - name: Prepare boost_1_84_0.tar.bz2 for Boost-for-Android
        run: |
          BOOST_FILE="${GITHUB_WORKSPACE}/Boost-for-Android/boost_1_84_0.tar.bz2"
          MIN_SIZE=50000000

          echo "==> Attempt 1: GitHub Releases"
          curl -fsSL -L --retry 3 -o "${BOOST_FILE}" \
            "https://github.com/boostorg/boost/releases/download/boost-1.84.0/boost_1_84_0.tar.bz2" \
            && SIZE=$(stat -c%s "${BOOST_FILE}") || SIZE=0

          if [ "${SIZE:-0}" -lt "$MIN_SIZE" ]; then
            echo "==> Attempt 2: archives.boost.io"
            curl -fsSL -L --retry 3 -o "${BOOST_FILE}" \
              "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2" \
              && SIZE=$(stat -c%s "${BOOST_FILE}") || SIZE=0
          fi

          if [ "${SIZE:-0}" -lt "$MIN_SIZE" ]; then
            echo "==> Attempt 3: JFrog Artifactory"
            curl -fsSL -L --retry 3 -o "${BOOST_FILE}" \
              "https://boostorg.jfrog.io/artifactory/main/release/1.84.0/source/boost_1_84_0.tar.bz2" \
              && SIZE=$(stat -c%s "${BOOST_FILE}") || SIZE=0
          fi

          if [ "${SIZE:-0}" -lt "$MIN_SIZE" ]; then
            echo "==> Attempt 4: git clone fallback"
            git clone --recurse-submodules --depth=1 \
              --branch boost-1.84.0 \
              https://github.com/boostorg/boost.git /tmp/boost_1_84_0
            cd /tmp && tar cjf "${BOOST_FILE}" boost_1_84_0/
            rm -rf /tmp/boost_1_84_0
          fi

          SIZE=$(stat -c%s "${BOOST_FILE}")
          echo "Final boost tarball size: ${SIZE} bytes"
          [ "$SIZE" -ge "$MIN_SIZE" ] || { echo "ERROR: All boost attempts failed!"; exit 1; }

      - name: Apply patches
        run: |
          cp _glu_meson.build glu/meson.build
          cp _glu_meson_options.txt glu/meson_options.txt
          cp _ngspice_configure.ac ngspice/configure.ac
          cp _icu_mh-linux icu/source/config/mh-linux

      - run: df -h /

      - name: Build Application
        run: ./all.sh

      - run: df -h /
        if: success() || failure()

      - name: Upload App arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: kicad_arm64-v8a
          path: kicadapp/app_arm64-v8a/build/outputs/apk/debug/app_arm64-v8a-debug.apk

      - name: Upload App x86_64
        uses: actions/upload-artifact@v4
        with:
          name: kicad_x86_64
          path: kicadapp/app_x86_64/build/outputs/apk/debug/app_x86_64-debug.apk
