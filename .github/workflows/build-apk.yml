name: Build KiCad Android APK

on:
  workflow_dispatch:
  push:
    branches: [ actions ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_NDK_VERSION: r25c
      ANDROID_NDK_HASH: 53af80a1cce9144025b81eff3d33af2f
      QT_VERSION: 6.6.2
      BUILD_TOOLS_VERSION: 34.0.0
      API_LEVEL: 28

    steps:
      # ── 1. Repo klonla (submodule'lerle birlikte) ────────────────────────
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          ref: actions
          submodules: recursive
          fetch-depth: 0

      # ── 2. JDK 17 — sdkmanager için zorunlu ──────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Sistem bağımlılıkları ─────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            python3 python3-pip \
            git curl wget unzip \
            libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libx11-dev \
            autoconf automake libtool \
            protobuf-compiler

          # Meson 1.3.0 — repo zorunluluğu
          pip3 install meson==1.3.0 --break-system-packages || pip3 install meson==1.3.0

      # ── 4. Android SDK ────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools & platform
        run: |
          sdkmanager --install \
            "platforms;android-${API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "platform-tools"

      # ── 5. Android NDK r25c ───────────────────────────────────────────────
      - name: Download Android NDK r25c
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" \
            -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d $HOME
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "NDK_ROOT=$HOME/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      # ── 5. Qt 6.6.2 (aqt ile) ────────────────────────────────────────────
      - name: Install aqt (Qt installer)
        run: pip3 install aqtinstall --break-system-packages || pip3 install aqtinstall

      - name: Cache Qt Desktop
        id: cache-qt-desktop
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt/desktop
          key: qt-desktop-${{ env.QT_VERSION }}-ubuntu22

      - name: Install Qt Desktop
        if: steps.cache-qt-desktop.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/Qt/desktop
          aqt install-qt linux desktop ${QT_VERSION} gcc_64 \
            -O ${{ github.workspace }}/Qt/desktop

      - name: Cache Qt Android
        id: cache-qt-android
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt/android
          key: qt-android-${{ env.QT_VERSION }}-arm64-x86_64

      - name: Install Qt Android (arm64-v8a + x86_64)
        if: steps.cache-qt-android.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/Qt/android
          aqt install-qt linux android ${QT_VERSION} android_arm64_v8a \
            -O ${{ github.workspace }}/Qt/android
          aqt install-qt linux android ${QT_VERSION} android_x86_64 \
            -O ${{ github.workspace }}/Qt/android

      - name: Set Qt paths
        run: |
          echo "QT_HOST_PATH=${{ github.workspace }}/Qt/desktop/${QT_VERSION}/gcc_64" >> $GITHUB_ENV
          echo "QT_TARGET_BASE=${{ github.workspace }}/Qt/android/${QT_VERSION}" >> $GITHUB_ENV

      # ── 6. Kaynak tarballs indir ──────────────────────────────────────────
      - name: Download source tarballs
        run: |
          # Yardımcı fonksiyon: önce dosyaya indir, sonra çıkart (pipe'dan daha güvenilir)
          dl() {
            local DIR="$1" URL="$2" OUT="/tmp/$(basename $DIR).tar.gz"
            mkdir -p "$DIR"
            echo ">>> Downloading $DIR from $URL"
            curl -fsSL --retry 3 --retry-delay 5 -o "$OUT" "$URL"
            # Boyut kontrolü: 10KB'dan küçükse hata
            local SIZE=$(stat -c%s "$OUT")
            if [ "$SIZE" -lt 10240 ]; then
              echo "ERROR: $DIR archive too small ($SIZE bytes) - probably an error page!"
              cat "$OUT"
              exit 1
            fi
            tar -xz --strip-components=1 -C "$DIR" -f "$OUT"
            rm -f "$OUT"
            echo "<<< OK: $DIR"
          }

          dl OCCT \
            'https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V7_8_1.tar.gz'

          dl libgit2 \
            'https://github.com/libgit2/libgit2/archive/refs/tags/v1.8.0.tar.gz'

          # ngspice — SourceForge güvenilmez, GitHub mirror kullan
          dl ngspice \
            'https://github.com/imr/ngspice/archive/refs/tags/ngspice-42.tar.gz' || \
          dl ngspice \
            'https://sourceforge.net/projects/ngspice/files/ng-spice-rework/42/ngspice-42.tar.gz/download'

          dl cairo \
            'https://gitlab.freedesktop.org/cairo/cairo/-/archive/02754405330989198548d1945b3c55566ba0c6b7/cairo-02754405330989198548d1945b3c55566ba0c6b7.tar.gz'

          # unixODBC — FTP yerine HTTP mirror
          dl unixODBC \
            'https://www.unixodbc.org/unixODBC-2.3.12.tar.gz' || \
          dl unixODBC \
            'http://www.unixodbc.org/unixODBC-2.3.12.tar.gz'

          dl zstd \
            'https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz'

          dl protobuf \
            'https://github.com/protocolbuffers/protobuf/archive/refs/tags/v3.12.4.tar.gz'

          # Python — .tgz uzantısı, çıkart parametresi aynı
          mkdir -p python
          curl -fsSL --retry 3 -o /tmp/python.tgz \
            'https://www.python.org/ftp/python/3.13.0/Python-3.13.0rc1.tgz'
          tar -xz --strip-components=1 -C python -f /tmp/python.tgz
          rm -f /tmp/python.tgz

          dl openssl \
            'https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz'

          # ICU — .tgz uzantısı
          mkdir -p icu
          curl -fsSL --retry 3 -o /tmp/icu.tgz \
            'https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz'
          tar -xz --strip-components=1 -C icu -f /tmp/icu.tgz
          rm -f /tmp/icu.tgz

          dl pcre2 \
            'https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz'

          dl boost \
            'https://github.com/boostorg/boost/releases/download/boost-1.85.0/boost-1.85.0-cmake.tar.gz'

          echo "=== All tarballs downloaded successfully ==="

      # ── 7. Patch uygula ───────────────────────────────────────────────────
      - name: Apply patches
        run: |
          cp _glu_meson.build glu/meson.build
          cp _glu_meson_options.txt glu/meson_options.txt
          cp _ngspice_configure.ac ngspice/configure.ac
          cp _icu_mh-linux icu/source/config/mh-linux

      # ── 7b. Boost-for-Android'ın beklediği boost_1_84_0.tar.bz2'yi hazırla ──
      - name: Prepare boost_1_84_0.tar.bz2 for Boost-for-Android
        run: |
          BOOST_FILE="${GITHUB_WORKSPACE}/Boost-for-Android/boost_1_84_0.tar.bz2"
          MIN_SIZE=50000000   # 50 MB — gerçek tarball en az bu kadar

          # 1. Deneme: GitHub Releases doğrudan bağlantı
          echo "==> Attempt 1: GitHub Releases"
          curl -fsSL -L --retry 3 --retry-delay 5 \
            -o "${BOOST_FILE}" \
            "https://github.com/boostorg/boost/releases/download/boost-1.84.0/boost_1_84_0.tar.bz2" \
            && SIZE=$(stat -c%s "${BOOST_FILE}") && echo "Size: $SIZE" \
            || SIZE=0

          # 2. Deneme: archives.boost.io (redirektsiz CDN)
          if [ "${SIZE:-0}" -lt "$MIN_SIZE" ]; then
            echo "==> Attempt 2: archives.boost.io"
            curl -fsSL -L --retry 3 --retry-delay 5 \
              -o "${BOOST_FILE}" \
              "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2" \
              && SIZE=$(stat -c%s "${BOOST_FILE}") && echo "Size: $SIZE" \
              || SIZE=0
          fi

          # 3. Deneme: boostorg JFrog Artifactory
          if [ "${SIZE:-0}" -lt "$MIN_SIZE" ]; then
            echo "==> Attempt 3: JFrog Artifactory"
            curl -fsSL -L --retry 3 --retry-delay 5 \
              -o "${BOOST_FILE}" \
              "https://boostorg.jfrog.io/artifactory/main/release/1.84.0/source/boost_1_84_0.tar.bz2" \
              && SIZE=$(stat -c%s "${BOOST_FILE}") && echo "Size: $SIZE" \
              || SIZE=0
          fi

          # 4. Son çare: GitHub'dan git clone + tarball oluştur
          if [ "${SIZE:-0}" -lt "$MIN_SIZE" ]; then
            echo "==> Attempt 4: git clone from GitHub (fallback)"
            git clone --recurse-submodules --depth=1 \
              --branch boost-1.84.0 \
              https://github.com/boostorg/boost.git \
              /tmp/boost_1_84_0
            echo "Packing tarball..."
            cd /tmp
            tar cjf "${BOOST_FILE}" boost_1_84_0/
            rm -rf /tmp/boost_1_84_0
            SIZE=$(stat -c%s "${BOOST_FILE}")
            echo "Size after packing: $SIZE"
          fi

          # Final kontrol
          SIZE=$(stat -c%s "${BOOST_FILE}")
          echo "Final boost tarball size: $SIZE bytes"
          if [ "$SIZE" -lt "$MIN_SIZE" ]; then
            echo "ERROR: All boost download attempts failed! ($SIZE bytes)"
            exit 1
          fi
          echo "=== Boost tarball ready ==="

      # ── 8. Qt path doğrulama ──────────────────────────────────────────────
      - name: Verify Qt installation paths
        run: |
          echo "=== QT_HOST_PATH ==="
          ls "${QT_HOST_PATH}/lib/cmake/Qt6/" 2>/dev/null | head -5 || echo "NOT FOUND: ${QT_HOST_PATH}/lib/cmake/Qt6/"

          echo "=== QT_TARGET_BASE content ==="
          ls "${QT_TARGET_BASE}/" 2>/dev/null || echo "NOT FOUND: ${QT_TARGET_BASE}"

          # aqt'nin oluşturduğu gerçek arch klasörünü bul
          QT_ANDROID_ARCH_DIR=$(find "${QT_TARGET_BASE}" -maxdepth 2 -name "Qt6Config.cmake" 2>/dev/null | head -1 | sed 's|/lib/cmake.*||')
          echo "Found Qt6Config.cmake in: ${QT_ANDROID_ARCH_DIR}"

          # Doğru path'i GITHUB_ENV'e kaydet
          if [ -n "${QT_ANDROID_ARCH_DIR}" ]; then
            echo "QT_ANDROID_ARCH_DIR=${QT_ANDROID_ARCH_DIR}" >> $GITHUB_ENV
            echo "Qt6_DIR=${QT_ANDROID_ARCH_DIR}/lib/cmake/Qt6" >> $GITHUB_ENV
          else
            # Fallback: standart aqt path
            FALLBACK="${QT_TARGET_BASE}/android_arm64_v8a"
            echo "QT_ANDROID_ARCH_DIR=${FALLBACK}" >> $GITHUB_ENV
            echo "Qt6_DIR=${FALLBACK}/lib/cmake/Qt6" >> $GITHUB_ENV
            echo "WARNING: Qt6Config.cmake not found, using fallback: ${FALLBACK}"
          fi

      # ── 9. Build! ─────────────────────────────────────────────────────────
      - name: Build KiCad for Android
        run: |
          export QT_HOST_PATH="${QT_HOST_PATH}"
          export QT_TARGET_BASE="${QT_TARGET_BASE}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}"

          # Qt6'nın CMAKE_PREFIX_PATH'e dahil edilmesi — her iki mimari için
          export Qt6_DIR="${QT_TARGET_BASE}/android_arm64_v8a/lib/cmake/Qt6"
          QT_X86_DIR="${QT_TARGET_BASE}/android_x86_64"
          export CMAKE_PREFIX_PATH="${QT_ANDROID_ARCH_DIR}:${QT_X86_DIR}:${QT_TARGET_BASE}/android_arm64_v8a:${QT_HOST_PATH}:${CMAKE_PREFIX_PATH}"
          export Qt6CoreTools_DIR="${QT_HOST_PATH}/lib/cmake/Qt6CoreTools"
          export Qt6GuiTools_DIR="${QT_HOST_PATH}/lib/cmake/Qt6GuiTools"
          export Qt6WidgetsTools_DIR="${QT_HOST_PATH}/lib/cmake/Qt6WidgetsTools"

          echo "Qt6_DIR=${Qt6_DIR}"
          echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"

          chmod +x all.sh
          ./all.sh
        timeout-minutes: 300

      # ── 10. APK bul ve artifact olarak yükle ─────────────────────────────
      - name: Find APK files
        run: |
          find . -name "*.apk" 2>/dev/null
          find . -name "*.aab" 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kicad-android-apk
          path: |
            **/*.apk
            **/*.aab
          retention-days: 30
          if-no-files-found: warn
